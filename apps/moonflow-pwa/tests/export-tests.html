<!DOCTYPE html>
<!-- Open this file directly in a browser to run the tests — no Node, no install, nothing but a browser. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moonflow — export tests</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; background: #14132b; color: #f5f3ec; }
  .pass { color: #8fe0a8; }
  .fail { color: #e08f9f; }
  h1 { font-size: 16px; font-weight: 500; }
</style>
</head>
<body>
<h1>Moonflow — export test results</h1>
<pre id="output">Running...</pre>

<script type="module">
import { buildExportPayload, exportFilename } from '../js/export.js';

const results = [];

function test(name, fn) {
  try {
    fn();
    results.push({ name, pass: true });
  } catch (e) {
    results.push({ name, pass: false, message: e.message });
  }
}

function assertEqual(actual, expected, label) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${label ?? 'expected'} ${e}, got ${a}`);
}

test('buildExportPayload round-trips entries, settings, and exportedAt exactly', () => {
  const entries = [{ date: '2026-09-04', flow: 'medium', symptoms: ['cramps'], mood: 'neutral', note: '' }];
  const settings = { avgCycleLength: 28, avgPeriodLength: 5, pinHash: 'shouldnt-matter-here' };
  const json = buildExportPayload(entries, settings, '2026-09-04T12:00:00.000Z');
  const parsed = JSON.parse(json);
  assertEqual(parsed.entries, entries);
  assertEqual(parsed.settings, settings);
  assertEqual(parsed.exportedAt, '2026-09-04T12:00:00.000Z');
});

test('buildExportPayload produces valid, parseable JSON even with zero entries', () => {
  const json = buildExportPayload([], {}, '2026-09-04T12:00:00.000Z');
  const parsed = JSON.parse(json);
  assertEqual(parsed.entries, []);
});

test('exportFilename formats a date-stamped .json filename', () => {
  assertEqual(exportFilename('2026-09-04'), 'moonflow-export-2026-09-04.json');
});

// --- Render ---
const passCount = results.filter(r => r.pass).length;
document.getElementById('output').innerHTML = results
  .map(r => r.pass
    ? `<span class="pass">✓ ${r.name}</span>`
    : `<span class="fail">✗ ${r.name}\n    ${r.message}</span>`)
  .join('\n') + `\n\n${passCount}/${results.length} passed`;
</script>
</body>
</html>
