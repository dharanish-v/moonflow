name: Deploy backend to PocketHost

on:
  push:
    branches: [main]
    paths:
      - apps/moonflow-backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PHIO_USERNAME: ${{ secrets.PHIO_USERNAME }}
      PHIO_PASSWORD: ${{ secrets.PHIO_PASSWORD }}
    steps:
      # The `runner` context isn't available in job-level `env`.
      - run: echo "PHIO_HOME=$RUNNER_TEMP/phio" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Migrations and access rules must pass on the pinned PocketBase before
      # anything reaches the live instance.
      - name: Rule tests
        working-directory: apps/moonflow-backend
        run: |
          ./scripts/fetch-pocketbase.sh
          node --test 'test/**/*.test.mjs'
      # phio 0.4.0's bin is `#!/usr/bin/env tsx`, so tsx must be on PATH too.
      - run: npm install -g phio@0.4.0 tsx@4.23.15
      # phio refuses to deploy if its local key doesn't match the account's
      # "Phio" key, so CI reuses the same key pair instead of generating one.
      - name: Write deploy key
        env:
          PHIO_DEPLOY_KEY: ${{ secrets.PHIO_DEPLOY_KEY }}
        run: |
          mkdir -p "$PHIO_HOME"
          printf '%s\n' "$PHIO_DEPLOY_KEY" > "$PHIO_HOME/phio_deploy_ed25519"
          chmod 600 "$PHIO_HOME/phio_deploy_ed25519"
          ssh-keygen -y -f "$PHIO_HOME/phio_deploy_ed25519" > "$PHIO_HOME/phio_deploy_ed25519.pub"
      - run: phio deploy -v
        working-directory: apps/moonflow-backend
      - name: Check the health route
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -m 20 https://moonflow.pockethost.io/api/moonflow/health | grep -q '"ok":true' && exit 0
            sleep 10
          done
          exit 1
