<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14132B">
<title>Moonflow</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tailwind-theme.css">

<style>
  html, body {
    margin: 0;
    background: var(--bg-frame);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  /* On an actual iPhone this is simply the whole viewport, edge to edge — no
     frame, no shadow, identical to before. On anything wider (this app has
     no desktop layout of its own — see the PRD's single-iPhone-user scope)
     it becomes a simulated phone screen centered on a backdrop, using
     --bg-frame/--radius-frame from tokens.css: both defined since Phase 0
     for exactly this ("Device frame... Device frame radius") but never
     actually wired up until now, which is why every screen previously
     rendered as a small clump pinned to the top-left of a huge black void
     on any non-phone-width window. translateZ(0) gives #tab-bar's
     position:fixed a containing block, so at the wide breakpoint it stays
     pinned to *this* simulated screen's edges instead of the real browser
     window's. */
  /* height (not min-height) + its own scroll, unconditionally — not just at
     the wide/framed breakpoint. Screens like Home need to vertically center
     their content within "the real available screen space" (#app-content's
     min-height:100% below), which only resolves against a parent with a
     definite height; min-height:100vh leaves that undefined at narrow
     widths, silently disabling centering on an actual phone precisely where
     it matters most. Content taller than the frame still scrolls exactly as
     it always did, just as this element's own scroll instead of the page's —
     immaterial once installed as a standalone PWA (no browser chrome to
     interact with regardless), the only context where this app is actually
     used day to day. */
  #phone-frame {
    position: relative;
    width: 100%;
    height: 100vh;
    background: var(--bg-screen);
    overflow-x: hidden;
    overflow-y: auto;
    transform: translateZ(0);
  }
  /* 27rem — just past .screen's own 26rem max-width — not an arbitrary
     desktop/tablet breakpoint. Anything wider than that is already dead flat
     space around the phone-width content today; framing right at that edge
     means there's no awkward in-between zone where the content is capped
     narrow but the backdrop hasn't kicked in to explain why yet.
     (hover: hover) and (pointer: fine) is the actual condition being tested
     for — "a mouse-driven desktop browser," not just "a wide viewport." Real
     phones (many Android devices report 400-480px+ CSS width, well past
     27rem) are touchscreens, so this guard keeps them edge-to-edge, never
     framed — width alone can't tell a real large phone apart from a resized
     desktop window, only pointer/hover capability can. */
  @media (min-width: 27rem) and (hover: hover) and (pointer: fine) {
    #phone-frame {
      width: 24.5625rem;  /* 393px — a representative modern iPhone width */
      height: 53.25rem;   /* 852px */
      max-height: 92vh;
      border-radius: var(--radius-frame);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.55), 0 0 0 0.5px var(--border-muted);
    }
  }
  /* Clears the fixed tab bar below (its own padding/border/button-height math,
     plus its bottom offset and a small gap) so content is never hidden
     behind it — reserved unconditionally, since screens without a tab bar
     (onboarding, the log sheet, PIN lock) just get a bit of harmless extra
     space at the very bottom rather than any risk of clipped content on the
     screens that do show it. */
  #app-content {
    padding-bottom: calc(2 * var(--space-2) + 2 * var(--border-width) + 2.75rem + var(--space-3) + env(safe-area-inset-bottom, 0.5rem));
    min-height: 100%; /* resolves against #phone-frame's now-definite height above — lets .screen--centered actually have real vertical space to center within, instead of just being as tall as its own content */
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  /* LCP skeleton (ADR-018) — a static placeholder that paints before app.js has
     read IndexedDB and rendered the real moon-phase illustration. Swapped out,
     not layered under, the moment the real content renders — see app.js. */
  #skeleton {
    padding: var(--space-6) var(--space-5);
    max-width: 26rem;
    margin: auto; /* centers within #app-content's flex column, matching Home's own centered composition once it renders */
    box-sizing: border-box;
    width: 100%;
    text-align: center;
  }
  #skeleton .skeleton-moon {
    width: 9.375rem;
    height: 9.375rem;
    border-radius: 50%;
    background: var(--surface-card);
    margin: 0 auto;
  }
  #skeleton .skeleton-line {
    height: 0.75rem;
    background: var(--surface-card);
    border-radius: 0.25rem;
    margin: var(--space-4) auto 0;
  }

  #tab-bar {
    display: none; /* shown by app.js once a screen that needs it is active */
    justify-content: space-around;
    /* position: sticky only sticks once its containing block actually has
       scroll room — on any screen shorter than the viewport (most of them),
       there's nothing to scroll, so it just renders in normal flow right
       after #app-content instead of pinning to the bottom of the screen.
       fixed always anchors to the viewport, regardless of content height. */
    position: fixed;
    left: 0;
    right: 0;
    bottom: env(safe-area-inset-bottom, 0.5rem);
    margin-left: auto;
    margin-right: auto;
    /* max-width alone collapses to 0 horizontal margin on any viewport
       narrower than 26rem — true of every real iPhone — losing the floating
       capsule's inset entirely (design-system.md: "margin on all sides so it
       visibly floats"). width: min(...) guarantees the space-4 inset always,
       while still capping/centering at 26rem on wider screens. */
    width: min(26rem, calc(100% - 2 * var(--space-4)));
    box-sizing: border-box; /* width above must include the padding+border below, or they re-add the exact margin the calc just carved out */
    padding: var(--space-2) var(--space-4);
    background: var(--glass-fill);
    border: var(--border-width) solid var(--glass-border);
    border-radius: var(--radius-tabbar);
  }
  #tab-bar button {
    width: 2.75rem; /* 44px — WCAG/HIG touch-target minimum, was a 19px icon-only hit area */
    height: 2.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text-secondary);
  }
  #tab-bar button svg { width: 1.2rem; height: 1.2rem; display: block; }
  #tab-bar button.tab-bar__button--active { color: var(--accent-gold); }
</style>
</head>
<body>

<div id="phone-frame">
  <!-- Real, static HTML — not JS-rendered. Paints before app.js executes (ADR-017). -->
  <div id="app-content">
    <div id="skeleton" aria-hidden="true">
      <div class="skeleton-moon"></div>
      <div class="skeleton-line" style="width:40%;"></div>
      <div class="skeleton-line" style="width:60%;"></div>
    </div>
  </div>

  <!-- Also static and real — never regenerated by a screen (ADR-017). app.js wires
       clicks and toggles the active icon; it does not render this markup. -->
  <nav id="tab-bar" aria-label="Main navigation">
    <button type="button" data-nav="home" aria-label="Home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 12 3z" fill="currentColor"/></svg></button>
    <button type="button" data-nav="calendar" aria-label="Calendar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <button type="button" data-nav="insights" aria-label="Insights"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></button>
    <button type="button" data-nav="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
