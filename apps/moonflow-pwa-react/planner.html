<!doctype html>
<html lang="en" style="background: #14132B">
  <head>
    <meta charset="UTF-8" />
    <!-- Same fix as index.html's — see its comment for why. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14132B" />
    <!-- Same as index.html: black-translucent for both entries — the app
         itself renders dark by default, and the light theme paints a navy
         band under the status bar (index.css) so white text stays readable. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Planner</title>

    <!-- ADR-011's discreet install identity: a second front door to the
         exact same app (same src/main.tsx, same React tree, same data) —
         only the manifest/icon/title differ, so installing from this link
         puts a neutral "Planner" icon on the home screen instead of
         Moonflow's own. The app itself (App.tsx's #phone-frame chrome
         included) doesn't know or care which entry loaded it. -->
    <link rel="manifest" href="manifest-discreet.json" />
    <link rel="apple-touch-icon" href="icons/icon-discreet-180.png" />
    <link rel="icon" href="icons/icon-discreet-192.png" />
    <script src="theme-boot.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Static launch shell (T84) — neutral glyph for the discreet install. -->
      <div style="display:flex;min-height:100dvh;align-items:center;justify-content:center">
        <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#A9A7D0" stroke-width="1.5"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M9 3v4M15 3v4" /></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
