<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: without it, the on-screen
         keyboard *overlays* content instead of shrinking the viewport —
         #phone-frame's 100dvh doesn't shrink either, so the Drawer (fixed
         within that frame) never gets pushed up, and the keyboard just
         sits on top of whatever was focused (LogEntry's Notes textarea,
         reported live: typing "didn't show" because it was hidden behind
         the keyboard, not actually broken). Chromium-based browsers honor
         this directly; the Notes onFocus handler covers iOS Safari, which
         doesn't. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#14132B" />
    <!-- Without this pair, iOS "Add to Home Screen" launches the installed
         icon inside Safari's own chrome (address bar + toolbar) instead of
         true standalone mode, despite manifest.json's "display": "standalone"
         — that extra browser chrome is what shrank the effective viewport
         and produced the reported "scrollbars / too small / have to zoom"
         bug on an already-installed PWA. black-translucent matches this
         entry's dark theme (content extends under the status bar, whose
         text reads fine against #14132B). Both the apple- and unprefixed
         mobile-web-app-capable tags are included — Chrome's own engine
         flags the apple- one as deprecated in favor of the unprefixed
         standard one (confirmed live), but iOS Safari's actual standalone
         behavior is still documented against the apple- prefix, so both
         stay, one per engine. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Moonflow</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
