name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/moonflow-pwa-react/package-lock.json
      - run: npm ci
        working-directory: apps/moonflow-pwa-react
      # No CI existed for this app until the React rewrite — a real test
      # gate before the deploy step, not just a build check.
      - run: npm test
        working-directory: apps/moonflow-pwa-react
      - run: npm run build
        working-directory: apps/moonflow-pwa-react
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/moonflow-pwa-react/dist
      - id: deployment
        uses: actions/deploy-pages@v4
